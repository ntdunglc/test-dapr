version: 1
common:
  resourcesPath: ./components/
  config: dapr-tracing-config
apps:
  - appID: coordinator
    appDirPath: ./agents/coordinator/
    appPort: 8000
    command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    
  - appID: echo_worker # Renamed from worker
    appDirPath: ./agents/worker/ # Directory path remains the same
    appPort: 8001
    command: ["python", "-m", "uvicorn", "agent:app", "--host", "0.0.0.0", "--port", "8001", "--reload"] # Changed app:app to agent:app
    
  - appID: chat
    appDirPath: ./agents/chat/
    appPort: 8002
    command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
