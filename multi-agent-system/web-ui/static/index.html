<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent System Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>Multi-Agent System Dashboard</h1>
            <div id="user-info"></div>
        </div>
        
        <div class="main-layout">
            <!-- Sessions Sidebar -->
            <div id="sessions-sidebar"> <!-- Panel class removed, will be a flex container -->
                <div class="panel" id="chat-sessions-panel"> <!-- New wrapper for chat sessions -->
                    <h2>Chat Sessions</h2>
                    <button id="new-chat-button">New Chat</button>
                    <ul id="sessions-list">
                        <!-- Session items will be populated here -->
                    </ul>
                </div>
                <div class="panel" id="jobs-panel"> <!-- Jobs panel moved here -->
                    <h2>Jobs</h2>
                    <button onclick="openSubmitJobModal()">Submit New Job</button>
                    <ul id="jobs-list"></ul>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="main-content">
                <div class="grid">
                    <!-- Agent Status -->
                    <div class="panel">
                        <h2>Agents</h2>
                        <div id="agents-list"></div>
                    </div>
                    
                    <!-- Job Queue panel is moved to the sidebar -->

                    <!-- Job Submission Modal -->
                    <div id="job-modal" class="modal">
                        <div class="modal-content">
                            <span class="close-button" onclick="closeSubmitJobModal()">&times;</span>
                            <h2>Submit New Job</h2>
                            <div>
                                <label for="job-agent-select">Assign to Agent:</label>
                                <select id="job-agent-select">
                                    <!-- Options will be populated by JS -->
                                </select>
                            </div>
                            <div>
                                <label for="job-description">Job Description:</label>
                                <textarea id="job-description" rows="4"></textarea>
                            </div>
                            <button onclick="handleModalJobSubmit()">Submit Job</button>
                            <button onclick="closeSubmitJobModal()" class="cancel-button">Cancel</button>
                        </div>
                    </div>
                    
                    <!-- Chat Interface -->
                    <div class="panel full-width">
                        <h2 id="chat-title">Agent Chat</h2> <!-- Title can be updated with session info -->
                        <div id="chat-messages"></div>
                        <div class="chat-input">
                            <input type="text" id="chat-input" placeholder="Type a message...">
                            <button onclick="sendMessage()">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
