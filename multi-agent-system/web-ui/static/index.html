<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent System Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>Multi-Agent System Dashboard</h1>
            <div id="user-info"></div>
        </div>
        
        <div class="main-layout">
            <!-- Sessions Sidebar -->
            <div id="sessions-sidebar"> 
                <div class="panel" id="interactions-panel"> 
                    <div class="panel-header">
                        <h2>Interactions</h2>
                        <div class="panel-actions">
                            <button id="new-chat-button">New Chat</button>
                            <button id="new-job-button" onclick="openSubmitJobModal()">New Job</button>
                        </div>
                    </div>
                    <ul id="interactions-list">
                        <!-- Chat sessions and Jobs will be populated here -->
                    </ul>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="main-content">
                <div class="grid">
                    <!-- Agent Status panel removed -->
                    
                    <!-- Job Queue panel is moved to the sidebar -->

                    <!-- Job Submission Modal -->
                    <div id="job-modal" class="modal">
                        <div class="modal-content">
                            <span class="close-button" onclick="closeSubmitJobModal()">&times;</span>
                            <h2>Submit New Job</h2>
                            <div>
                                <label for="job-agent-select">Assign to Agent:</label>
                                <select id="job-agent-select">
                                    <!-- Options will be populated by JS -->
                                </select>
                            </div>
                            <div>
                                <label for="job-description">Job Description:</label>
                                <textarea id="job-description" rows="4"></textarea>
                            </div>
                            <button onclick="handleModalJobSubmit()">Submit Job</button>
                            <button onclick="closeSubmitJobModal()" class="cancel-button">Cancel</button>
                        </div>
                    </div>
                    
                    <!-- Chat Interface -->
                    <div class="panel full-width">
                        <h2 id="chat-title">Agent Chat</h2> <!-- Title can be updated with session info -->
                        <div id="chat-messages"></div>
                        <div class="chat-input">
                            <input type="text" id="chat-input" placeholder="Type a message...">
                            <button onclick="sendMessage()">Send</button>
                        </div>
                        <div class="chat-command-note">
                            Tip: Try commands like <code>@echo your message</code> or <code>@llm your question</code>.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
